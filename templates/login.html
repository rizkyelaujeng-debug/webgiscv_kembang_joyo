{% extends 'base.html' %}
{% block title %}Login - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 350px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">🔑</span> Login Pelanggan</div>
        <div class="title-bar-controls">
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 32px;">🔐</span>
            <p style="margin: 0;">Silakan masukkan Nomor HP dan Kata Sandi Anda untuk masuk ke sistem.</p>
        </div>
        <form action="/login" method="POST">
            <div class="field-row" style="margin-bottom: 10px;">
                <label style="width: 90px;">Nomor HP:</label>
                <input type="text" name="no_hp" required style="width: 180px;">
            </div>
            <div class="field-row" style="margin-bottom: 15px;">
                <label style="width: 90px;">Kata Sandi:</label>
                <input type="password" name="password" required style="width: 180px;">
            </div>
            <div style="text-align: right; border-top: 1px solid #ccc; padding-top: 10px;">
                <button type="submit" style="width: 80px; font-weight: bold;">Login</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
