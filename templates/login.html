<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registrasi - CV. Kembar Joyo</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .link { margin-top: 15px; font-size: 14px; color: #007bff; cursor: pointer; text-decoration: underline; }
        .nav-back { display: block; margin-top: 20px; font-size: 14px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Masuk ke Akun</h2>
        <form action="/login" method="POST">
            <input type="text" name="no_hp" placeholder="Nomor HP Pelanggan" required>
            <input type="password" name="password" placeholder="Kata Sandi" required>
            <button type="submit">Login</button>
        </form>
        
        <a href="/register" class="link" style="display:block;">Belum punya akun? Daftar di sini</a>
        
        <a href="/" class="nav-back">⬅ Kembali ke Peta GIS</a>
    </div>

</body>
</html>
