{% extends 'base.html' %}
{% block title %}Login - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 100%; max-width: 420px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">🔑</span> Login Pelanggan</div>
        <div class="title-bar-controls">
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body" style="padding: 12px;">

        <!-- Header icon + teks -->
        <div style="display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;">
            <span style="font-size: 32px; flex-shrink: 0;">🔐</span>
            <p style="margin: 0; font-size: 13px; padding-top: 4px;">
                Silakan masukkan Nomor HP dan Kata Sandi Anda untuk masuk ke sistem.
            </p>
        </div>

        <!-- Pesan error -->
        {% if error %}
        <div style="background:#f8d7da; border:1px solid #f5c6cb; padding:6px 10px; margin-bottom:10px; color:#721c24; font-size:12px;">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <!-- Form login -->
        <form action="/login" method="POST">
            <div class="field-row" style="margin-bottom: 10px;">
                <label style="width: 90px; flex-shrink: 0;">Nomor HP:</label>
                <input type="text" name="no_hp" required style="flex: 1; min-width: 0;">
            </div>
            <div class="field-row" style="margin-bottom: 14px;">
                <label style="width: 90px; flex-shrink: 0;">Kata Sandi:</label>
                <input type="password" name="password" required style="flex: 1; min-width: 0;">
            </div>
            <div style="border-top: 1px solid #ccc; padding-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                <a href="/register" style="font-size: 12px; color: #000080; text-decoration: underline;">
                    📝 Buat Akun Baru
                </a>
                <button type="submit" style="width: 80px; font-weight: bold;">Login</button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
