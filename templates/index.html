{% extends 'base.html' %}
{% block title %}Peta Mitra - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 100%; max-width: 800px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">🌍</span> Peta Lokasi Mitra Fotokopi</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <p>Menampilkan lokasi mitra fotokopi CV. Kembar Joyo di sekitar Universitas Tadulako (Palu).</p>
        
        <!-- Kotak Sunken untuk Peta -->
        <div class="sunken-panel" style="padding: 2px;">
            <!-- Library Leaflet untuk WebGIS -->
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            
            <div id="map" style="height: 400px; width: 100%;"></div>
            
            <script>
                // Koordinat awal (Pusat Kota Palu / Untad)
                var map = L.map('map').setView([-0.836, 119.893], 13);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // Data Lokasi dari Database (Flask Jinja2)
                {% for loc in lokasi %}
                L.marker([{{ loc.latitude }}, {{ loc.longitude }}])
                 .addTo(map)
                 .bindPopup("<b>{{ loc.nama_toko }}</b><br>Alamat: {{ loc.alamat }}");
                {% endfor %}
            </script>
        </div>
    </div>
</div>
{% endblock %}
