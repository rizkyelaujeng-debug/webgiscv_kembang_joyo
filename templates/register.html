{% extends 'base.html' %}
{% block title %}Pendaftaran - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 100%; max-width: 440px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">📝</span> Pendaftaran Pelanggan Baru</div>
        <div class="title-bar-controls">
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body" style="padding: 12px;">

        <p style="margin: 0 0 12px 0; font-size: 13px;">Silakan isi data diri Anda untuk membuat akun baru.</p>

        <form action="/register" method="POST">
            <fieldset style="margin-bottom: 14px;">
                <legend>Data Diri</legend>
                <div class="field-row" style="margin-bottom: 10px;">
                    <label style="width: 100px; flex-shrink: 0;">Nama Lengkap:</label>
                    <input type="text" name="nama_lengkap" required style="flex: 1; min-width: 0;">
                </div>
                <div class="field-row" style="margin-bottom: 10px;">
                    <label style="width: 100px; flex-shrink: 0;">Nomor HP:</label>
                    <input type="text" name="no_hp" required style="flex: 1; min-width: 0;">
                </div>
                <div class="field-row">
                    <label style="width: 100px; flex-shrink: 0;">Kata Sandi:</label>
                    <input type="password" name="password" required style="flex: 1; min-width: 0;">
                </div>
            </fieldset>

            <div style="border-top: 1px solid #ccc; padding-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                <a href="/login" style="font-size: 12px; color: #000080; text-decoration: underline;">
                    🔑 Sudah punya akun? Login
                </a>
                <button type="submit" style="width: 100px; font-weight: bold;">Daftar</button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
