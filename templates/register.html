={% extends 'base.html' %}
{% block title %}Pendaftaran - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 400px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">📝</span> Pendaftaran Pelanggan Baru</div>
        <div class="title-bar-controls">
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <p>Silakan isi data diri Anda untuk membuat akun baru.</p>
        <form action="/register" method="POST">
            <fieldset style="margin-bottom: 15px;">
                <legend>Data Diri</legend>
                <div class="field-row" style="margin-bottom: 10px;">
                    <label style="width: 100px;">Nama Lengkap:</label>
                    <input type="text" name="nama_lengkap" required style="width: 220px;">
                </div>
                <div class="field-row" style="margin-bottom: 10px;">
                    <label style="width: 100px;">Nomor HP:</label>
                    <input type="text" name="no_hp" required style="width: 220px;">
                </div>
                <div class="field-row">
                    <label style="width: 100px;">Kata Sandi:</label>
                    <input type="password" name="password" required style="width: 220px;">
                </div>
            </fieldset>
            <div style="text-align: right; border-top: 1px solid #ccc; padding-top: 10px;">
                <button type="submit" style="width: 100px; font-weight: bold;">Daftar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
