{% extends 'base.html' %}
{% block title %}Login Admin - Kembar Joyo{% endblock %}

{% block content %}
<div class="window" style="width: 100%; max-width: 350px; margin: 0 auto;">
    <div class="title-bar">
        <div class="title-bar-text"><span style="margin-right: 5px;">⚙️</span> Administrator System</div>
        <div class="title-bar-controls">
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body">
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 32px;">🛡️️</span>
            <p style="margin: 0;">Masukkan Username dan Password khusus Admin.</p>
        </div>
        <form action="/admin_login" method="POST">
            <div class="field-row" style="margin-bottom: 10px;">
                <label style="width: 90px;">Username:</label>
                <input type="text" name="username" required style="flex: 1; min-width: 0;">
            </div>
            <div class="field-row" style="margin-bottom: 15px;">
                <label style="width: 90px;">Password:</label>
                <input type="password" name="password" required style="flex: 1; min-width: 0;">
            </div>
            <div style="text-align: right; border-top: 1px solid #ccc; padding-top: 10px;">
                <button type="submit" style="width: 90px; font-weight: bold;">Login Admin</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
