<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CV. Kembar Joyo{% endblock %}</title>
    <!-- CSS Tema Windows XP -->
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <style>
        body {
            /* Warna latar biru langit sebagai cadangan */
            background-color: #3a6ea5;
            /* Memanggil wallpaper Bliss langsung dari folder static lokal proyek */
            background-image: url("{{ url_for('static', filename='bliss.jpg') }}");
            background-size: cover;
            background-attachment: fixed;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 60px; /* Ruang untuk taskbar di bawah */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 600px; /* Ukuran standar jendela */
        }
        
        /* Desain Taskbar Windows XP buatan sendiri */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #245edb 92%, #333 100%);
            display: flex;
            align-items: center;
            z-index: 1000;
            border-top: 1px solid #000;
        }
        .start-btn {
            background: linear-gradient(to bottom, #3b8214 0%, #469e16 10%, #3b8214 20%, #3b8214 100%);
            border: none;
            color: white;
            font-weight: bold;
            font-style: italic;
            font-size: 18px;
            height: 100%;
            padding: 0 25px;
            display: flex;
            align-items: center;
            border-right: 1px solid #1a3a08;
            border-radius: 0 15px 15px 0;
            cursor: pointer;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
        }
        .start-btn:active {
            background: #2d6b0e;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            margin-left: 15px;
        }
        .nav-item {
            background-color: #3b82f6;
            color: white;
            padding: 7px 15px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #1e3a8a;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-item:hover {
            background-color: #2563eb;
        }
        .nav-item:active {
            background-color: #1d4ed8;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<!-- Tempat di mana konten halaman lain akan dimunculkan -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- Taskbar Navigasi Global -->
<div class="taskbar">
    <button class="start-btn"><i>start</i></button>
    <div class="nav-links">
        <a href="/" class="nav-item">🌍 Peta Lokasi</a>
        <a href="/register" class="nav-item">📝 Daftar</a>
        <a href="/login" class="nav-item">🔑 Login</a>
        <a href="/pesan" class="nav-item">🖨️ Pesan Cetakan</a>
        <a href="/admin" class="nav-item" style="background-color: #d97706; border-color: #92400e;">⚙️ Admin</a>
        <a href="/logout" class="nav-item" style="background-color: #dc2626; border-color: #991b1b;">🚪 Logout</a>
    </div>
</div>

</body>
</html>
